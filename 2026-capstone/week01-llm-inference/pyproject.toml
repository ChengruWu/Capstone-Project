[project]
name = "week1-llm-inference"
version = "0.1.0"
description = "Week 1 Qwen LLM inference assignment"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.4.0",
    "transformers==4.51.3",
    "safetensors>=0.4.3",
    "numpy<2",
]

[project.optional-dependencies]
download = ["modelscope>=1.40.0"]

[tool.uv]
index-strategy = "first-index"

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
